[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Generic hybrid RAG backend"
authors = ["Retrieva <team@retrieva.dev>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.4"
psycopg2-binary = "^2.9.12"
redis = "^5.3.1"
pymilvus = "^2.4.0"
python-dotenv = "^1.0.1"
pydantic = "^2.10.12"
pydantic-settings = "^2.0"
requests = "^2.31.0"
python-multipart = "^0.0.20"

# Orchestration
langgraph = "^0.6.0"

# Native LLM & Embeddings
langchain-core = "^0.3.0"
# Claude is the augmentation/generation provider for every LLM call.
langchain-anthropic = "^0.3.0"
# Ollama serves the open-source embedding model locally.
langchain-ollama = "^0.2.0"
langchain-openai = "^0.3.0"
langchain-google-genai = "^2.0.0"

# Parsing & Chunking
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
# Imported directly by the docx/excel parser strategies; `tabulate` backs
# DataFrame.to_markdown(). Previously only present transitively.
pandas = "^2.2.0"
tabulate = "^0.9.0"
langchain-text-splitters = "^0.3.0"

# Reranking
sentence-transformers = "^3.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
