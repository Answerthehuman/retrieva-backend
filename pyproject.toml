[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Generic hybrid RAG backend"
authors = ["OpenAI <assistant@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.4"
psycopg2-binary = "^2.9.12"
redis = "^5.3.1"
pymilvus = "^2.3.0"
python-dotenv = "^1.0.1"
pydantic = "^2.10.12"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
